<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial y Logs - Repuestos Hamilton</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column vh-100 bg-body-tertiary loading-auth">

    <div class="d-flex flex-grow-1 overflow-hidden">

        <!-- Sidebar -->
        <div class="sidebar text-white p-3 d-flex flex-column h-100" id="sidebar">
            <div
                class="navbar-brand text-center fs-4 fw-bold mb-4 py-2 text-primary border-bottom border-secondary d-flex align-items-center justify-content-center">
                <i class="bi bi-gear-fill me-2 fs-3"></i>
                <span class="logo-text">HAMILTON</span>
            </div>
            <ul class="nav nav-pills flex-column mb-auto gap-1">
                <li class="nav-item admin-only" id="nav-item-dashboard">
                    <a href="dashboard.html" class="nav-link text-white" id="nav-dashboard">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="inventory.html" class="nav-link text-white" id="nav-inventory">
                        <i class="bi bi-box-seam me-2"></i> Inventario
                    </a>
                </li>
                <li class="nav-item">
                    <a href="sales.html" class="nav-link text-white" id="nav-sales">
                        <i class="bi bi-receipt me-2"></i> Notas de Venta
                    </a>
                </li>
                <li class="nav-item">
                    <a href="caja.html" class="nav-link text-white" id="nav-caja">
                        <i class="bi bi-cash-stack me-2"></i> Cierre de Caja
                    </a>
                </li>

                <li class="nav-item mt-3 mb-1 admin-only" id="nav-header-admin">
                    <small class="text-uppercase text-secondary fw-bold ms-3"
                        style="font-size: 0.7rem; letter-spacing: 1px;">Sistema</small>
                </li>
                <li class="nav-item admin-only" id="nav-item-users">
                    <a href="users.html" class="nav-link text-white" id="nav-users">
                        <i class="bi bi-people me-2"></i> Usuarios
                    </a>
                </li>
                <li class="nav-item admin-only">
                    <a href="logs.html" class="nav-link active" id="nav-logs">
                        <i class="bi bi-journal-text me-2"></i> Historial de Mov.
                    </a>
                </li>
            </ul>
            <hr>
            <div class="d-flex flex-column">
                <div class="d-flex align-items-center mb-3">
                    <i class="bi bi-person-circle fs-3 me-2 text-secondary"></i>
                    <div style="line-height: 1.2;">
                        <small id="current-user" class="d-block text-truncate" style="max-width: 170px;">Usuario</small>
                        <span class="badge bg-primary mt-1" id="current-role">Cargando...</span>
                    </div>
                </div>
                <button class="btn btn-outline-light btn-sm w-100" id="btn-logout">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                </button>
                <div class="mt-4 text-center" style="font-size: 0.75rem; color: rgba(255,255,255,0.4);">
                    Desarrollado por {Dev Marco}
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 d-flex flex-column" id="main-content">
            <!-- Topbar -->
            <div class="d-flex justify-content-between align-items-center p-3 bg-body shadow-sm border-bottom">
                <button class="btn btn-light" id="btn-toggle-sidebar"><i class="bi bi-list fs-5"></i></button>
                <div class="form-check form-switch d-flex align-items-center">
                    <input class="form-check-input me-2 fs-5" type="checkbox" id="theme-toggle">
                    <label class="form-check-label" for="theme-toggle"><i
                            class="bi bi-moon-stars-fill text-secondary"></i></label>
                </div>
            </div>

            <!-- Page Content -->
            <div class="p-4 overflow-auto flex-grow-1" id="app-screen">
                <div class="mb-4">
                    <p class="display-6 fw-bold text-primary mb-0" style="font-size: 1.8rem;">Historial de Movimientos
                    </p>
                    <p class="text-muted">Registro de todas las acciones importantes del sistema.</p>
                </div>

                <div class="custom-panel">
                    <div class="table-responsive">
                        <table class="table table-custom">
                            <thead>
                                <tr>
                                    <th>Fecha y Hora</th>
                                    <th>Usuario</th>
                                    <th>Módulo</th>
                                    <th>Acción</th>
                                    <th>Detalles</th>
                                </tr>
                            </thead>
                            <tbody id="logs-table-body">
                                <tr>
                                    <td colspan="5" class="text-center">
                                        <div class="spinner-border text-primary my-3" role="status"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/modules/logs.js"></script>
</body>

</html>
