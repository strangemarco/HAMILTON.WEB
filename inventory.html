<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Repuestos Hamilton</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="d-flex" style="min-height: 100vh;">
        <!-- Sidebar -->
        <div class="bg-dark text-white p-3 d-flex flex-column" id="sidebar" style="width: 260px;">
            <a href="#" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <i class="bi bi-tools fs-4 me-2 text-primary"></i>
                <span class="fs-5 fw-bold">Repuestos Hamilton</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto gap-1">
                <li class="nav-item mt-2 mb-1 d-none" id="nav-header-principal">
                    <small class="text-uppercase text-secondary fw-bold ms-3" style="font-size: 0.7rem; letter-spacing: 1px;">Principal</small>
                </li>
                <li class="nav-item d-none" id="nav-item-dashboard">
                    <a href="dashboard.html" class="nav-link text-white" id="nav-dashboard">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </a>
                </li>
                
                <li class="nav-item mt-3 mb-1">
                    <small class="text-uppercase text-secondary fw-bold ms-3" style="font-size: 0.7rem; letter-spacing: 1px;">Gestión</small>
                </li>
                <li class="nav-item">
                    <a href="inventory.html" class="nav-link active" id="nav-inventory">
                        <i class="bi bi-box-seam me-2"></i> Inventario
                    </a>
                </li>
                <li class="nav-item">
                    <a href="sales.html" class="nav-link text-white" id="nav-sales">
                        <i class="bi bi-receipt me-2"></i> Notas de Venta
                    </a>
                </li>
                
                <li class="nav-item mt-3 mb-1 d-none" id="nav-header-admin">
                    <small class="text-uppercase text-secondary fw-bold ms-3" style="font-size: 0.7rem; letter-spacing: 1px;">Sistema</small>
                </li>
                <li class="nav-item d-none" id="nav-item-users">
                    <a href="users.html" class="nav-link text-white" id="nav-users">
                        <i class="bi bi-people me-2"></i> Usuarios
                    </a>
                </li>
            </ul>
            <hr>
            <div class="d-flex flex-column">
                <div class="d-flex align-items-center mb-3">
                    <i class="bi bi-person-circle fs-3 me-2 text-secondary"></i>
                    <div style="line-height: 1.2;">
                        <small id="current-user" class="d-block text-truncate" style="max-width: 170px;">Usuario</small>
                        <span class="badge bg-primary mt-1" id="current-role">Cargando...</span>
                    </div>
                </div>
                <button class="btn btn-outline-light btn-sm w-100" id="btn-logout">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 bg-body-tertiary d-flex flex-column" style="width: calc(100% - 260px); overflow: hidden;">
            <!-- Topbar -->
            <div class="d-flex justify-content-between align-items-center p-3 bg-body shadow-sm border-bottom">
                <button class="btn btn-light" id="btn-toggle-sidebar"><i class="bi bi-list fs-5"></i></button>
                <div class="form-check form-switch d-flex align-items-center">
                    <input class="form-check-input me-2 fs-5" type="checkbox" id="theme-toggle">
                    <label class="form-check-label" for="theme-toggle"><i class="bi bi-moon-stars-fill text-secondary"></i></label>
                </div>
            </div>

            <!-- Page Content -->
            <div class="p-4 overflow-auto flex-grow-1" id="app-screen">
        <div id="loading-indicator" class="text-center d-none my-5">
            <div class="spinner-border text-primary" role="status"></div>
        </div>

        <div id="view-inventory">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <p class="display-6 fw-bold text-primary mb-0" style="font-size: 1.8rem;">Gestión de Inventario</p>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal">
                    <i class="bi bi-plus-circle me-1"></i> Nuevo Producto
                </button>
            </div>
            
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Sust.</th>
                                    <th>Descripción</th>
                                    <th>Marca</th>
                                    <th>Precio Compra (P1)</th>
                                    <th>Precio Límite (P2)</th>
                                    <th>Precio Venta (P3)</th>
                                    <th>Stock</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-table-body">
                                <!-- Products loaded here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="inventory-pagination" class="mt-3 d-flex justify-content-end"></div>
                </div>
            </div>
        </div>
    </div>

    </div>
    </div>

    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Añadir/Editar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="product-form">
                        <input type="hidden" id="prod-id">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Código</label>
                                <input type="text" class="form-control" id="prod-codigo" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Sust.</label>
                                <input type="text" class="form-control" id="prod-sust">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Marca</label>
                                <input type="text" class="form-control" id="prod-marca">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Descripción</label>
                                <input type="text" class="form-control" id="prod-descripcion" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Precio Compra (P1)</label>
                                <input type="number" step="0.01" class="form-control" id="prod-p1" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Precio Límite (P2)</label>
                                <input type="number" step="0.01" class="form-control" id="prod-p2" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Precio Venta (P3)</label>
                                <input type="number" step="0.01" class="form-control" id="prod-p3" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Stock Actual</label>
                                <input type="number" class="form-control" id="prod-stock" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-save-product">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
