<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Repuestos Hamilton</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="login-screen" class="container-fluid vh-100 p-0">
        <div class="row g-0 h-100">
            <!-- Left Side: Form -->
            <div class="col-md-5 d-flex align-items-center justify-content-center bg-body">
                <div class="w-100 px-4 px-lg-5" style="max-width: 450px;">
                    <div class="text-center mb-5">
                        <h2 class="fw-bold text-primary display-6 mb-3">Iniciar Sesión</h2>
                        <p class="text-muted">Por favor, ingresa tus credenciales</p>
                    </div>
                    
                    <form id="login-form">
                        <div class="mb-4">
                            <label for="email" class="form-label text-muted small text-uppercase fw-bold ms-1">Usuario o Correo</label>
                            <input type="email" class="form-control form-control-lg bg-body-tertiary border-0 px-3" id="email" placeholder="nombre de usuario" required style="border-radius: 8px;">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label text-muted small text-uppercase fw-bold ms-1">Contraseña</label>
                            <input type="password" class="form-control form-control-lg bg-body-tertiary border-0 px-3" id="password" placeholder="contraseña" required style="border-radius: 8px;">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-4" style="border-radius: 8px; font-size: 1.1rem;">Ingresar</button>
                    </form>
                </div>
            </div>

            <!-- Right Side: Welcome Banner -->
            <div class="col-md-7 d-none d-md-flex align-items-center justify-content-center login-banner">
                <div class="text-center text-white" style="z-index: 2;">
                    <h1 class="display-3 fw-bold mb-3" style="letter-spacing: 2px;">BIENVENIDO !</h1>
                    <p class="fs-4 fw-light text-light">Inicia sesión para continuar en Repuestos Hamilton</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
