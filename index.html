<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Repuestos Hamilton</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="loading-auth login-page">
    <div class="login-layout">
        <div class="form-section">
            <div>
                <h1 class="brand-headline">Repuestos<br><span>Hamilton</span></h1>
                <p class="brand-subtitle">Acceso al sistema de inventario.</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email" class="custom-label">Correo electrónico</label>
                    <input type="email" class="custom-input" id="email" placeholder="nombre@hamilton.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password" class="custom-label">Contraseña</label>
                    <input type="password" class="custom-input" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
        </div>
        <div class="visual-section"></div>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
